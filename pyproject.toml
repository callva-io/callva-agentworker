[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "callva-agentworker"
dynamic = ["version"]
description = "One headless turn of a coding agent (Claude Code or Codex): launch, run, read, classify."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "CallVA" }]
keywords = ["claude", "codex", "headless", "agent", "worker", "subprocess"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/callva-io/callva-agentworker"
Source = "https://github.com/callva-io/callva-agentworker"

[tool.hatch.version]
path = "callva/agentworker/version.py"

[tool.hatch.build.targets.wheel]
packages = ["callva"]

[tool.hatch.build.targets.sdist]
include = ["/callva", "/README.md", "/DESIGN.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
