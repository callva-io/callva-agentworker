name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv pip install -e ".[dev]"

      - name: Lint
        run: uv run ruff check .

      # The suite runs on fake engines placed on PATH; no real claude or codex is
      # needed and no credential is read. The one live smoke lives outside CI.
      - name: Test
        run: uv run pytest -q
