# Profile "act": a task to carry out in a project.
#
# The run has full access: every tool without a permission prompt on claude,
# and no sandbox and no approvals on codex. It may edit, run tests, commit and
# push from inside the target project.
#
# One table per harness; the table name is the harness.

[claude]
model = "claude-opus-5-5"
effort = "medium"
timeout_seconds = 3600
permission_mode = "bypassPermissions"
append_system_prompt = "You are running with full write access inside THIS target project. Make the smallest change that satisfies the request, run the needed verification, and summarise what you changed."

[codex]
model = "gpt-6-sol"
effort = "medium"
timeout_seconds = 3600
approval_policy = "never"
codex_config = { sandbox_mode = "danger-full-access" }
append_system_prompt = "You are running with full write access inside THIS target project. Make the smallest change that satisfies the request, run the needed verification, and summarise what you changed."
