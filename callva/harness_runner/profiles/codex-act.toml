# Profile "codex-act": a task to carry out in a project, on codex.
#
# The run has full access: no sandbox and no approvals. It may edit, run
# tests, commit and push from inside the target project.
#
# The model is the family sol: the runner resolves it at run time to the
# newest listed sol model in codex's own catalog, so a newer sol model needs
# no release, and a catalog with no sol model fails the run rather than
# running another family.

harness = "codex"
model = "sol"
effort = "medium"
timeout_seconds = 3600
approval_policy = "never"
codex_config = { sandbox_mode = "danger-full-access" }
append_system_prompt = "You are running with full write access inside THIS target project. Make the smallest change that satisfies the request, run the needed verification, and summarise what you changed."
